# Server
server.port=8080

# ─────────────────────────────────────────────────────────────────────
# Database
# In Docker: DB_HOST=db (compose service name), credentials from .env
# Locally:   set MYSQL_USER and MYSQL_PASSWORD env vars
# ─────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:project_management}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool — retry on startup until DB is ready
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTSigningMustBeAtLeast256BitsLong12345}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.projectmanagement=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost}

# Actuator — exposes /actuator/health for Docker healthcheck
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.server.port=8080
